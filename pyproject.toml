[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "too-fresh"
dynamic = ["version"]
description = "Find dependencies in your lockfiles that were published too recently to trust. npm, pnpm, yarn, bun, uv, poetry, pip, cargo, go."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Tanbir Hossain Ramim" }]
keywords = ["supply-chain", "security", "lockfile", "npm", "pypi", "cargo", "cooldown", "dependencies", "ci"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/TanbirRamim/too-fresh"
Issues = "https://github.com/TanbirRamim/too-fresh/issues"

[project.scripts]
too-fresh = "too_fresh.cli:main"

[tool.hatch.version]
path = "src/too_fresh/__init__.py"
