name: too-fresh
description: Fail the build when a lockfile pins a dependency published in the last N days
branding:
  icon: clock
  color: orange
inputs:
  days:
    description: Minimum age in days
    default: "7"
  paths:
    description: Lockfiles or directories to scan (space separated)
    default: "."
  ignore:
    description: Comma separated package names or globs to allow
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      env:
        TOO_FRESH_IGNORE: ${{ inputs.ignore }}
      run: |
        pip install --quiet "${{ github.action_path }}"
        too-fresh ${{ inputs.paths }} --days "${{ inputs.days }}"
